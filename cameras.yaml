      - {label: K&M Camera, shop: kmcamera.com}
      - {label: Brooklyn Film Camera, shop: brooklynfilmcamera.com}

  # Any SR-T model (101, 102, 201, 202, 303...).
  - name: Minolta SRT
    search: "minolta srt"
    title_has_any: ["minolta srt"]
    exclude: ["for minolta"]
    min_price: 30
    sources:
      - {label: eBay (used), ebay_query: "minolta srt", condition: used}
      - {label: K&M Camera, shop: kmcamera.com}
      - {label: Brooklyn Film Camera, shop: brooklynfilmcamera.com}

  - name: Pentax K1000
    search: "pentax k1000"
    title_has_any: ["k1000"]
    exclude: ["for pentax"]
    min_price: 40
    sources:
      - {label: eBay (used), ebay_query: "pentax k1000", condition: used}
      - {label: K&M Camera, shop: kmcamera.com}
      - {label: Brooklyn Film Camera, shop: brooklynfilmcamera.com}
